<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bagas DH • VIP Member</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{
background:
linear-gradient(
160deg,
#8b0000 0%,
#8b0000 35%,
#111 35%,
#111 100%
);

min-height:100vh;

display:flex;
justify-content:center;

padding:20px;
overflow-x:hidden;
}

.wrap{
width:390px;
max-width:100%;
}

/* MAIN */
.main{

background:
rgba(0,0,0,.35);

backdrop-filter:blur(10px);

padding:20px;

border-radius:30px;

border:
1px solid rgba(255,255,255,.08);

box-shadow:
0 20px 70px rgba(0,0,0,.55);

}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.brand{
display:flex;
align-items:center;
gap:12px;
}

.brand img{
width:50px;
height:50px;
border-radius:14px;
object-fit:cover;
}

.brand h2{
font-size:16px;
font-weight:900;
color:#fff;
}

.brand p{
font-size:10px;
color:#ddd;
margin-top:3px;
}

.vip{
padding:7px 12px;

border-radius:999px;

background:#1DB954;

font-size:10px;
font-weight:900;

color:#000;
}

/* FORM */
.form{
margin-bottom:20px;
}

.input{
width:100%;

padding:14px;

margin-top:10px;

border:none;
outline:none;

border-radius:16px;

background:
rgba(255,255,255,.08);

color:#fff;

font-size:12px;
}

.input::placeholder{
color:#bbb;
}

.btn{
width:100%;

padding:14px;

margin-top:12px;

border:none;

border-radius:18px;

background:#1DB954;

color:#000;

font-weight:900;

cursor:pointer;

transition:.2s;
}

.btn:hover{
transform:translateY(-2px);
}

/* LIST */
.list{
display:flex;
flex-direction:column;
gap:18px;
}

/* CARD */
.card{

position:relative;

overflow:hidden;

padding:18px;

border-radius:30px;

background:
linear-gradient(
180deg,
#101010,
#050505
);

box-shadow:
0 20px 50px rgba(0,0,0,.5);

}

/* DIAGONAL */
.card::before{

content:"";

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

background:
linear-gradient(
160deg,
transparent 0%,
transparent 50%,
rgba(255,255,255,.03) 50%,
rgba(255,255,255,.03) 100%
);

pointer-events:none;

}

/* COVER */
.cover{
width:100%;
height:250px;

object-fit:cover;

border-radius:22px;

margin-bottom:22px;
}

/* TITLE */
.member-title{

font-size:42px;
line-height:1.05;
font-weight:900;

color:#fff;

letter-spacing:-2px;

}

/* ROLE */
.role{

margin-top:12px;

font-size:13px;

color:#cfcfcf;

line-height:1.6;

}

/* FOOTER */
.footer{

margin-top:28px;

display:flex;
justify-content:space-between;
align-items:center;

}

/* QR */
.qr img{
width:76px;
height:76px;

background:#fff;

padding:5px;

border-radius:14px;
}

/* INFO */
.info small{
display:block;

font-size:10px;

color:#aaa;
}

.info h4{
font-size:14px;

color:#fff;

margin-top:5px;
}

/* BUTTONS */
.action{

margin-top:16px;

display:flex;
gap:10px;
}

.action button{

flex:1;

padding:12px;

border:none;

border-radius:16px;

font-weight:800;

cursor:pointer;

font-size:12px;
}

.download{
background:#1DB954;
color:#000;
}

.delete{
background:#ff375f;
color:#fff;
}

/* MOBILE */
@media(max-width:480px){

.member-title{
font-size:34px;
}

.cover{
height:220px;
}

}

</style>
</head>

<body>

<div class="wrap">

<div class="main">

<!-- HEADER -->
<div class="header">

<div class="brand">

<img
src="https://i.scdn.co/image/ab67616100005174cfe66a9d78691a42f9d55a19">

<div>

<h2>Bagas DH</h2>

<p>Spotify Style VIP Card</p>

</div>

</div>

<div class="vip">
VIP
</div>

</div>

<!-- FORM -->
<div class="form">

<input
type="text"
class="input"
id="name"
placeholder="Nama Member">

<input
type="text"
class="input"
id="role"
placeholder="Keterangan / Status">

<button
class="btn"
onclick="addMember()">

Tambah Member

</button>

</div>

<!-- LIST -->
<div class="list" id="list"></div>

</div>

</div>

<script>

let members =
JSON.parse(
localStorage.getItem("members")
) || [];

/* RENDER */
function render(){

const list =
document.getElementById("list");

list.innerHTML = "";

members.forEach((m,i)=>{

list.innerHTML += `

<div class="card"
id="card-${i}">

<img
class="cover"
src="https://i1.sndcdn.com/artworks-ZJjf7q0MW938-0-t500x500.png">

<h1 class="member-title">

"${m.name}"<br>
VIP Access

</h1>

<div class="role">

${m.role}

</div>

<div class="footer">

<div class="info">

<small>MEMBER ID</small>

<h4>
VIP-${1000+i}
</h4>

</div>

<div class="qr">

<img
src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=VIP-${1000+i}">

</div>

</div>

<div class="action">

<button
class="download"
onclick="downloadCard(${i})">

Download

</button>

<button
class="delete"
onclick="deleteMember(${i})">

Delete

</button>

</div>

</div>

`;

});

}

render();

/* ADD */
function addMember(){

const name =
document.getElementById("name").value;

const role =
document.getElementById("role").value;

if(!name){

alert("Nama wajib diisi");
return;

}

members.push({

name:name,
role:role || "Official VIP Member"

});

localStorage.setItem(
"members",
JSON.stringify(members)
);

document.getElementById("name").value="";
document.getElementById("role").value="";

render();

}

/* DELETE */
function deleteMember(i){

members.splice(i,1);

localStorage.setItem(
"members",
JSON.stringify(members)
);

render();

}

/* DOWNLOAD */
async function downloadCard(i){

const card =
document.getElementById(`card-${i}`);

const action =
card.querySelector(".action");

/* HIDE BUTTON */
action.style.display = "none";

await new Promise(r=>
setTimeout(r,200)
);

const canvas =
await html2canvas(card,{
scale:4,
useCORS:true,
backgroundColor:"#050505"
});

const a =
document.createElement("a");

a.href =
canvas.toDataURL("image/png");

a.download =
`spotify-style-member-${i}.png`;

document.body.appendChild(a);

a.click();

document.body.removeChild(a);

/* SHOW AGAIN */
action.style.display = "flex";

}

</script>

</body>
</html>
